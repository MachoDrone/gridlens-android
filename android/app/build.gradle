plugins { id 'com.android.application' }
def mobileVersion = new groovy.json.JsonSlurper().parse(file('../../version.json'))

android {
    namespace 'com.gridlens.android'
    compileSdk 35
    ndkVersion '27.3.13750724'
    defaultConfig {
        applicationId 'com.gridlens.android'
        minSdk 26
        targetSdk 35
        versionCode mobileVersion.versionCode as int
        versionName mobileVersion.versionName as String
        testInstrumentationRunner 'com.gridlens.android.SmokeInstrumentation'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        externalNativeBuild {
            cmake { arguments '-DANDROID_STL=c++_shared', '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON' }
        }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        release {
            if (System.getenv('GRIDLENS_KEYSTORE')) {
                storeFile file(System.getenv('GRIDLENS_KEYSTORE'))
                storePassword System.getenv('GRIDLENS_KEYSTORE_PASSWORD')
                keyAlias System.getenv('GRIDLENS_KEY_ALIAS')
                keyPassword System.getenv('GRIDLENS_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('GRIDLENS_KEYSTORE')) signingConfig signingConfigs.release
        }
    }
    externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' } }
    packaging {
        jniLibs { useLegacyPackaging false }
        // Desktop OSGi metadata is duplicated by the two SSH crypto libraries.
        // Android does not use it; their license notices are bundled separately.
        resources.excludes += 'META-INF/versions/**/OSGI-INF/MANIFEST.MF'
    }
}

dependencies {
    implementation 'com.github.mwiede:jsch:2.28.8'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.86'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.apache.sshd:sshd-core:2.16.0'
    testImplementation 'org.slf4j:slf4j-nop:2.0.17'
}
